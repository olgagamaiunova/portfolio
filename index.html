<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ольга Гамаюнова, портфолио</title>
<meta name="description" content="Продуктовый UX/UI-дизайнер: сложные B2B-системы, CRM, PIM, OMS, BI и дизайн-системы. Белград, Сербия.">
<meta property="og:title" content="Ольга Гамаюнова, портфолио">
<meta property="og:description" content="Превращаю сложную B2B-логику в понятные интерфейсы.">
<meta name="theme-color" content="#131116">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23131116'/%3E%3Ctext x='16' y='23' font-family='monospace' font-size='22' font-weight='700' text-anchor='middle' fill='%23ECE8E0'%3E@%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500&family=Martian+Mono:wght@400&display=swap">
<script>try{var s=localStorage.getItem("pf2-theme");if(s==="dark"||s==="light")document.documentElement.setAttribute("data-theme",s);var l=localStorage.getItem("pf2-lang");if(l==="en"||l==="ru")document.documentElement.lang=l;}catch(e){}</script>
<style>
/* =========================================================================
   SYSTEM
   type:   5 sizes, 2 weights (400, 500), 2 families
           t1 11px mono uppercase (labels, buttons)   t2 14px   t3 17px
           t4 20–26px (headings, leads)               t5 36–72px (titles)
   space:  one 8-based scale, s1…s7
   grid:   12 columns, the same gutter and gap everywhere
   ========================================================================= */
:root,:root[data-theme="dark"]{
  --paper:#131116; --ink:#ECE8E0; --muted:#9A948B; --line:#2E2A31; --accent:#FF7DBB; --hi:#1D1A21; --card:#1C1A21; color-scheme:dark;
  --f-text:"Golos Text","Helvetica Neue",Arial,system-ui,sans-serif;
  --f-mono:"Martian Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --t1:11px; --t2:14px; --t3:17px; --t4:clamp(20px,1.8vw,26px); --t5:clamp(36px,5vw,72px); --th:clamp(26px,3.2vw,52px);
  --s1:8px; --s2:16px; --s3:24px; --s4:clamp(32px,3.4vw,48px); --s5:clamp(48px,5.6vw,80px); --s6:clamp(72px,8.4vw,120px); --s7:clamp(104px,12.2vw,176px);
  --gut:max(clamp(16px,4vw,48px),calc((100vw - 1200px) / 2)); --gap:clamp(10px,1vw,14px); --cp:clamp(14px,1.25vw,18px); --bar:56px;
}
:root[data-theme="light"]{ --paper:#FFFFFF; --ink:#120F17; --muted:#6B6A70; --line:#E4E4E2; --accent:#EF4FA0; --hi:#ECECEA; --card:#F5F5F3; color-scheme:light; }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--bar) + var(--s2))}
body{margin:0;background:var(--paper);color:var(--ink);font:400 var(--t3)/1.5 var(--f-text);-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit}
button{font:inherit;color:inherit}
h1,h2,h3,h4,p,ol,ul,dl,dd,figure,blockquote{margin:0;font-weight:inherit;font-size:inherit}
ol,ul{padding:0;list-style:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
::selection{background:var(--ink);color:var(--paper)}

/* the five styles */
.lbl{font:400 var(--t1)/1.6 var(--f-mono);text-transform:uppercase;letter-spacing:.02em}
.t2{font-size:var(--t2);line-height:1.5}
.t4{font:500 var(--t4)/1.2 var(--f-text);letter-spacing:-.015em}
.t5{font:500 var(--t5)/1 var(--f-text);letter-spacing:-.035em;text-wrap:balance}
/* poster text: the one style for titles across the site, like the blocks on the first screen */
.pt,.hb-2{font:500 var(--t2)/1.45 var(--f-text);text-transform:uppercase;letter-spacing:.06em}
.muted{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--gap)}
.wrap{padding-left:var(--gut);padding-right:var(--gut)}
.ph{background:color-mix(in srgb,var(--accent) 18%,transparent)}

/* buttons: one system, sharp, 44px */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:44px;padding:0 18px;border:1px solid var(--ink);border-radius:0;background:var(--ink);color:var(--paper);font:400 var(--t1)/1 var(--f-mono);text-transform:uppercase;letter-spacing:.04em;text-decoration:none;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s}
.btn:hover{background:var(--paper);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink)}
.stage-cta .btn.ghost{background:var(--paper)}
.stage-cta .btn.ghost:hover{background:var(--ink)}
.btn.ghost:hover{background:var(--ink);color:var(--paper)}
.btn svg{width:14px;height:14px;flex:none}
.tbtn{display:inline-flex;align-items:center;min-height:44px;padding:0 var(--s1);border:0;background:none;color:var(--muted);font:400 var(--t1)/1 var(--f-mono);text-transform:uppercase;letter-spacing:.02em;cursor:pointer;text-decoration:none}
.tbtn:hover,.tbtn[aria-pressed="true"],.tbtn.on{color:var(--ink)}
.tbtn[aria-pressed="true"]::before,.tbtn.on::before{content:"→";margin-right:6px}

/* top bar */
.bar{position:fixed;inset:0 0 auto;z-index:40;height:var(--bar);display:flex;align-items:center;justify-content:space-between;gap:var(--s2);padding:0 calc(var(--gut) - var(--s1));background:color-mix(in srgb,var(--paper) 88%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.bar .home{color:var(--ink)}
.bar nav{display:flex;align-items:center;gap:var(--s1)}
.bar .ctl{display:flex;align-items:center}
.bar .ctl .sep{color:var(--line);font:400 var(--t1)/1 var(--f-mono)}
.ibtn{width:44px;height:44px;display:grid;place-items:center;border:0;background:none;color:var(--ink);cursor:pointer}
.ibtn svg{width:18px;height:18px}
.burger{display:none}
.menu{position:fixed;top:var(--bar);right:var(--gut);z-index:45;min-width:220px;padding:var(--s1) 0;background:var(--paper);border:1px solid var(--ink)}
.menu[hidden]{display:none}
.menu a{display:flex;min-height:44px;align-items:center;padding:0 var(--s2);font:400 var(--t1)/1 var(--f-mono);text-transform:uppercase;text-decoration:none}
.menu a:hover{background:var(--ink);color:var(--paper)}

/* hero: one centred column, headline, portrait, two buttons, status */
.hero{--sz:min(400px,calc(100svh - var(--bar) - 330px),40vw);position:relative;min-height:100svh;padding:calc(var(--bar) + var(--s3)) var(--gut) var(--s5);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s3);text-align:center}
.field{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;z-index:0}
.hb{position:relative;z-index:2}
.hb-1{order:1;max-width:18em;font:500 var(--th)/1.08 var(--f-text);text-transform:uppercase;letter-spacing:.02em}
.stage{order:2;position:relative;z-index:1;width:var(--sz);aspect-ratio:1;touch-action:pan-y;cursor:crosshair;user-select:none;-webkit-user-select:none}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage-cta{order:3;position:relative;z-index:3;display:flex;gap:6px}
.hb-2{order:4;color:var(--muted)}
.hb-0{order:0}
.dot{display:inline-block;width:6px;height:6px;margin-right:var(--s1);border-radius:50%;background:#3DBB4A;vertical-align:2px;animation:blink 2.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.3}}

/* sections */
.sec{padding-top:var(--s6)}
.sec-head{margin-bottom:var(--s3)}
.sec-head h2{grid-column:1/7}

/* WIDGETS: every block is a card on the dotted paper. Sharp corners like the buttons,
   no borders, no shadows. A card starts with a small mono header row (.wh) */
.bento{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:var(--gap)}
.card{position:relative;display:flex;flex-direction:column;gap:var(--s2);min-width:0;padding:var(--cp);background:var(--card);color:var(--ink);border:0;border-radius:0;text-align:left;text-decoration:none}
button.card,a.card{cursor:pointer;font:inherit}
.wh{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s2);color:var(--muted)}
.wh>span:last-child{text-align:right}
.card .grow{flex:1}
.card .num{display:block;font-variant-numeric:tabular-nums}
.cover{position:relative;display:block;overflow:hidden;background:var(--tint,var(--hi))}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.cover.contain img{object-fit:contain}
.cbot{display:flex;flex-direction:column;gap:6px;margin-top:auto}
.go{display:inline-block;transition:transform .25s}
.card:hover .go,.card:focus-visible .go{transform:translate(2px,-2px)}
.ccase:hover .cover img,.ccase:focus-visible .cover img{transform:scale(1.025)}

/* cases: one large case and two result widgets, then three cases */
/* every case is its own card: cover, title, and its main number in the corner.
   Wide and narrow cards swap places from row to row */
.ccase{grid-column:span 6}
.ccase .cover{aspect-ratio:3/2}

/* side projects: two widgets, the second screen shows on hover */
.w-proj{grid-column:span 6;display:flex;flex-direction:column;gap:var(--s3)}
.w-proj .cover,.w-proj .cbot{width:min(100%,460px);margin-inline:auto}
.w-proj .cover{aspect-ratio:800/829}
.shot{background:#fff}
.shot img{object-position:top center;transition:opacity .35s,transform .6s cubic-bezier(.2,.7,.2,1)}
.shot img+img{opacity:0}
.shot.vid{aspect-ratio:4/5!important}
.shot video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s}
.shot video.on{opacity:1}
.sim.on .wb{opacity:1}
.sim.on .cd{opacity:1}

/* about */
.w-bio{grid-column:1/9;justify-content:space-between}
.w-bio .t4{font-weight:400;letter-spacing:-.01em;max-width:34em}
.w-seek{grid-column:9/13}
.w-xp{grid-column:1/9;grid-row:span 3}
.w-lang,.w-edu,.w-sk{grid-column:9/13}
.w-tools,.w-ai{grid-column:span 6}
.xpl{display:flex;flex-direction:column;gap:var(--s3)}
.xpl li{display:grid;grid-template-columns:minmax(9em,1fr) 3fr;column-gap:var(--gap);row-gap:4px;align-items:baseline}
.xpl .y{color:var(--muted);font-variant-numeric:tabular-nums}
.xpl .r{font-weight:500}
.xpl .r span{font-weight:400;color:var(--muted)}
.xpl .d{grid-column:2;color:var(--muted);max-width:62ch}
.edl{display:flex;flex-direction:column;gap:var(--s2)}
.edl li{display:flex;justify-content:space-between;gap:var(--s2);align-items:baseline}
.edl .r span{display:block;color:var(--muted)}
.langs{display:flex;flex-direction:column;gap:10px}
.langs li{display:grid;grid-template-columns:1fr auto;column-gap:var(--s2);row-gap:2px;align-items:baseline}
.langs .lv{color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px 18px}

/* contact */
.w-mail{grid-column:1/9}
.w-clock{grid-column:9/13}
.mail{display:block;width:100%;margin:0;padding:0;border:0;background:none;text-align:left;cursor:pointer;color:var(--ink);overflow-wrap:anywhere;font-size:var(--th)}
.mail:hover{color:var(--accent)}
.w-mail .cta{color:var(--muted);max-width:46ch}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.w-clock .num{font:500 var(--t5)/1 var(--f-text);letter-spacing:-.035em}
.clock{font-variant-numeric:tabular-nums}
.mtop{display:flex;flex-direction:column;gap:6px}


/* footer: a field of ASCII flowers */
.site-foot{margin-top:var(--s6)}
.site-foot .meadow{margin-top:var(--s4)}
.meadow{position:relative;height:clamp(420px,38vw,560px);cursor:crosshair;overflow:hidden;touch-action:pan-y}
.meadow canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.meadow .takes{display:none}
.foot{padding:var(--s2) 0 var(--s3);row-gap:var(--s1);align-items:center;color:var(--muted)}
.foot .f1{grid-column:1/7}.foot .f2{grid-column:7/10}.foot .f3{grid-column:10/13;text-align:right}
.site-foot .foot{padding-left:var(--gut);padding-right:var(--gut);background:var(--paper)}

/* case page: a left rail (cols 1–2), content from col 3 */
.case{padding-top:calc(var(--bar) + var(--s2))}
.case[hidden],.home[hidden]{display:none}
.case-top{align-items:center}
.case-top .back{grid-column:1/5;justify-self:start}
.case-top .crumb{grid-column:5/13;text-align:right;color:var(--muted)}
.case-head{margin-top:var(--s6);row-gap:var(--s2)}
.case-head .k{grid-column:1/3;color:var(--muted)}
.case-head h1{grid-column:3/13;outline:none}
.case-head .sub{grid-column:3/10;font-weight:400;color:var(--muted);text-wrap:balance}
.case-head .intro{grid-column:3/10;max-width:62ch}
.brief{margin-top:var(--s5)}
.brief,.case-meta,.case-stats{row-gap:var(--gap)}
.case-meta,.case-stats{margin-top:var(--gap)}
.brief>div,.case-meta>div,.case-stats>div{display:flex;flex-direction:column;gap:var(--s1);padding:var(--cp);background:var(--card)}
.brief>div:first-child{grid-column:3/7}.brief>div:nth-child(2){grid-column:7/10}.brief>div:nth-child(3){grid-column:10/13}
.brief dt,.case-meta dt{color:var(--muted)}
.case-meta>div{grid-column:span 2}
.case-meta>div:first-child{grid-column:3/5}
.case-stats>div:first-child{grid-column:3/7}.case-stats>div:nth-child(2){grid-column:7/10}.case-stats>div:nth-child(3){grid-column:10/13}
.case-stats b{display:block;font-variant-numeric:tabular-nums}
.case-stats span{display:block;color:var(--muted);max-width:26ch}
.case-cover{margin-top:var(--gap);aspect-ratio:16/9}
.case-body{margin-top:var(--s6);align-items:start}
.toc{grid-column:1/3;position:sticky;top:calc(var(--bar) + var(--s3));display:flex;flex-direction:column;margin-left:calc(-1 * var(--s1))}
.toc .tbtn{min-height:32px}
.flow{grid-column:3/13;display:flex;flex-direction:column;gap:var(--s6)}
.cs{display:flex;flex-direction:column;gap:var(--s3);scroll-margin-top:calc(var(--bar) + var(--s3))}
.cs h2{margin-bottom:var(--s1)}
.cs p,.cs li{max-width:66ch}
.dash li{position:relative;padding:6px 0 6px 22px}
.dash li::before{content:"";position:absolute;left:2px;top:.95em;width:8px;height:1px;background:var(--ink)}
.fig{display:flex;flex-direction:column;gap:var(--s1);max-width:none}
.fig img{width:100%;height:auto;background:var(--hi)}
.fig figcaption{color:var(--muted)}
.quote{padding:var(--cp);background:var(--card);display:flex;flex-direction:column;gap:var(--s2)}
.quote p{font-weight:400;max-width:40ch}
.two{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap)}
.two h4{margin-bottom:var(--s1)}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--gap)}
.steps li,.tri li{display:flex;flex-direction:column;gap:var(--s1);padding:var(--cp);background:var(--card)}
.steps .lbl,.tri .lbl{color:var(--muted)}
.decision{display:flex;flex-direction:column;gap:var(--s2)}
.decision h3,.res h4,.lessons h4{font-weight:500}
.note{max-width:66ch}
.note .lbl{margin-right:var(--s1);color:var(--muted)}
.tri{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gap)}
.state{align-self:flex-start;padding:5px var(--s1);border:1px solid var(--ink)}
.res{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s3) var(--gap)}
.res li{display:flex;flex-direction:column;gap:var(--s1);padding:var(--cp);background:var(--card)}
.res p,.lessons p{color:var(--muted)}
.lessons{display:flex;flex-direction:column;gap:var(--s3)}
.lessons li{display:flex;flex-direction:column;gap:4px}
.files{display:flex;flex-wrap:wrap;gap:6px}
.next{display:block;width:100%;margin-top:var(--s6);padding:var(--cp);border:0;background:var(--card);text-align:left;cursor:pointer;color:inherit}
.next .t5{display:block;margin-top:var(--s4)}
.next:hover .t5{color:var(--accent)}

/* overlays */
.fx{position:fixed;inset:0;z-index:70;pointer-events:none;width:100%;height:100%}
.ring{position:fixed;inset:0;z-index:75;pointer-events:none;width:100vw;height:100vh;view-transition-name:ring}
@property --vr{syntax:"<length>";inherits:false;initial-value:0px}
::view-transition-group(root),::view-transition-old(root),::view-transition-new(root),
::view-transition-group(ring),::view-transition-old(ring),::view-transition-new(ring){animation:none}
::view-transition-old(ring){display:none}
::view-transition-new(root){-webkit-mask-image:radial-gradient(circle at var(--vx,50%) var(--vy,50%),#000 calc(var(--vr) - var(--vw,120px)),transparent var(--vr));mask-image:radial-gradient(circle at var(--vx,50%) var(--vy,50%),#000 calc(var(--vr) - var(--vw,120px)),transparent var(--vr))}
.tag{position:fixed;left:0;top:0;z-index:80;pointer-events:none;padding:7px 9px;background:var(--ink);color:var(--paper);opacity:0;transform:translate(-100px,-100px);transition:opacity .15s}
.tag.show{opacity:1}
.toast{position:fixed;left:50%;bottom:var(--s3);z-index:90;transform:translate(-50%,20px);padding:12px var(--s2);background:var(--ink);color:var(--paper);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* responsive */
@media (max-width:1100px){
  .w-bio,.w-seek{grid-column:1/13}
  .w-xp{grid-column:1/13;grid-row:auto}
  .w-lang,.w-edu,.w-sk{grid-column:span 4}
  .w-mail{grid-column:1/13}.w-clock{grid-column:1/13}
  .steps{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brief>div:first-child,.brief>div:nth-child(2),.brief>div:nth-child(3){grid-column:span 4}
}
@media (max-width:760px){
  :root{--bar:52px}
  .bar nav,.bar .cv,.bar .sep{display:none}
  .burger{display:grid}
  .hero{--sz:min(86vw,420px);min-height:auto;align-items:stretch;justify-content:flex-start;text-align:left;padding-bottom:var(--s4)}
  .field{display:none}
  .hb-1{max-width:none}
  .stage{align-self:center}
  .stage-cta{align-self:flex-start}
  .sec-head h2{grid-column:1/13}
  .bento>*{grid-column:1/-1 !important;grid-row:auto !important}
  .xpl li{grid-template-columns:1fr}
  .xpl .d{grid-column:1}
  .meadow{height:520px}
  .foot .f1,.foot .f2,.foot .f3{grid-column:1/13;text-align:left}
  .case-top .back{grid-column:1/13}.case-top .crumb{display:none}
  .case-head .k,.case-head h1,.case-head .sub,.case-head .intro{grid-column:1/13}
  .brief>div:first-child,.brief>div:nth-child(2),.brief>div:nth-child(3){grid-column:1/13}
  .case-meta>div,.case-meta>div:first-child{grid-column:span 6}
  .case-stats>div:first-child,.case-stats>div:nth-child(2),.case-stats>div:nth-child(3){grid-column:1/13}
  .toc{display:none}
  .flow{grid-column:1/13}
  .two,.tri,.res{grid-template-columns:1fr}
  .steps{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  .dot{animation:none}
  .shot img,.cover img{transition:none}
}
</style>
</head>
<body>
<header class="bar" id="bar">
  <a class="tbtn home" href="#top" data-go="top" id="homeLink"></a>
  <nav id="nav" aria-label="Разделы"></nav>
  <div class="ctl">
    <a class="tbtn cv" id="cvTop" href="#" target="_blank" rel="noopener">CV</a>
    <span class="sep" aria-hidden="true">/</span>
    <button class="tbtn" data-lang="ru">Ru</button>
    <button class="tbtn" data-lang="en">En</button>
    <button class="ibtn" id="themeBtn"></button>
    <button class="ibtn burger" id="burger" aria-expanded="false" aria-controls="menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 8h16M4 16h16"/></svg></button>
  </div>
</header>
<div class="menu" id="menu" hidden></div>

<main>
  <div class="home" id="home">
    <section class="hero" id="top">
      <p class="hb hb-2 hb-0" id="hb0"></p>
      <h1 class="hb hb-1" id="hb1"></h1>
      <p class="hb hb-2" id="hb2"></p>
      <div class="stage" id="stage">
        <p class="sr" id="stageDesc"></p>
      </div>

      if (calm) { f.g = 1; kick(); } else kick();
    });
    new ResizeObserver(() => { cols = 0; layout(); kick(); }).observe(host);
    if ("IntersectionObserver" in window) new IntersectionObserver((es) => { vis = es[0].isIntersecting; if (vis) { prev = 0; kick(); } }).observe(host);
    themeHooks.push(() => { tint(); paintBg(); kick(); });
    kick();
  }

  /* =====================================================================
     CASE PAGE
     ===================================================================== */
  const KEYS = ["overview", "research", "design", "testing", "learnings"];
  function renderCase(i) {
    const cs = CASES(), c = cs[i], nx = cs[(i + 1) % cs.length], u = U();
    const L = { ...u.labels, ...(c.labels || {}) };
    const r = c.research || {}, te = c.testing || {};
    const paras = (v) => (Array.isArray(v) ? v : [v]).filter((x) => x).map((x) => `<p>${t(x)}</p>`).join("");
    const list = (a) => (a && a.length ? `<ul class="dash">${a.map((x) => `<li>${t(x)}</li>`).join("")}</ul>` : "");
    const fig = (img, cap) => { const s = src(img); return s ? `<figure class="fig"><img src="${esc(s)}" alt="${esc(plain(cap || ""))}" loading="lazy">${cap ? `<figcaption class="lbl">${t(cap)}</figcaption>` : ""}</figure>` : ""; };
    const body = {
      overview: `${paras(c.challenge)}${list(c.problems)}${fig(c.beforeImage, c.beforeCaption)}
        ${c.question ? `<blockquote class="quote"><span class="lbl muted">${esc(u.question)}</span><p class="t4">${t(c.question)}</p></blockquote>` : ""}
        ${(c.given && c.given.length) || (c.did && c.did.length) ? `<div class="two"><div><h4 class="lbl muted">${esc(u.given)}</h4>${list(c.given)}</div><div><h4 class="lbl muted">${esc(u.did)}</h4>${list(c.did)}</div></div>` : ""}`,
      research: `${paras(r.method)}${fig(r.image, r.caption)}
        ${(r.insights || []).map((x) => `<p class="find lbl">${esc(u.finding)}</p>
          <ol class="steps">${["heard", "help", "tried", "feature"].map((f, j) => `<li class="t2"><span class="lbl">${esc(u.chain[j])}</span>${t(x[f])}</li>`).join("")}</ol>`).join("")}`,
      design: (c.decisions || []).map((x) => `<div class="decision"><h3>${t(x.title)}</h3>${paras(x.text)}${fig(x.image, x.caption)}
          ${x.why ? `<p class="note t2"><span class="lbl">${esc(u.why)}</span>${t(x.why)}</p>` : ""}
          ${x.result ? `<p class="note t2"><span class="lbl">${esc(u.result)}</span>${t(x.result)}</p>` : ""}
          ${x.tradeoff ? `<p class="note t2"><span class="lbl">${esc(u.trade)}</span>${t(x.tradeoff)}</p>` : ""}</div>`).join(""),
      testing: `${paras(te.setup)}
        ${(te.findings || []).map((f) => `<ol class="tri">${["before", "saw", "change"].map((k, j) => `<li class="t2"><span class="lbl">${esc(u.tri[j])}</span>${t(f[k])}</li>`).join("")}</ol>${f.status ? `<span class="state lbl">${t(f.status)}</span>` : ""}`).join("")}
        ${te.results && te.results.length ? `<ul class="res">${te.results.map((x) => `<li><h4>${t(x.title)}</h4><p class="t2">${t(x.text)}</p></li>`).join("")}</ul>` : ""}
        ${fig(te.image, te.caption)}`,
      learnings: `${c.learnings && c.learnings.length ? `<ul class="lessons">${c.learnings.map((l) => `<li><h4>${t(l.title)}</h4><p class="t2">${t(l.text)}</p></li>`).join("")}</ul>` : ""}
        ${c.reflection ? `<blockquote class="quote"><span class="lbl muted">${esc(u.reflection)}</span><p class="t4">${t(c.reflection)}</p></blockquote>` : ""}
        ${c.delivered && c.delivered.length ? `<h3 class="lbl muted">${esc(u.delivered)}</h3>${list(c.delivered)}` : ""}
        ${c.files && c.files.length ? `<h3 class="lbl muted">${esc(u.files)}</h3><div class="files">${c.files.map((f) => linkBtn(tr(f.label), f.url)).join("")}</div>` : ""}`
    };
    const keys = KEYS.filter((k) => body[k].replace(/\s+/g, ""));
    const brief = [[u.brief[0], Array.isArray(c.challenge) ? c.challenge[0] : c.challenge], [u.brief[1], c.question], [u.brief[2], c.shift]].filter((x) => x[1] && !/^\[/.test(x[1]));
    caseEl.innerHTML = `
      <div class="case-top grid">
        <button class="btn ghost back" data-back>${ICON.left}${esc(u.back)}</button>
        <p class="crumb lbl">${esc(u.nav.work)} / ${esc(plain(c.title))}</p>
      </div>
      <header class="case-head grid">
        <p class="k lbl">${t(c.year)}</p>
        <h1 class="t5" tabindex="-1">${t(c.title)}</h1>
        <p class="sub t4">${t(c.subtitle)}</p>
        <p class="intro">${t(c.intro)}</p>
      </header>
      ${brief.length ? `<dl class="brief grid">${brief.map(([k, v]) => `<div><dt class="lbl">${esc(k)}</dt><dd class="t2">${t(v)}</dd></div>`).join("")}</dl>` : ""}
      <dl class="case-meta grid">${["role", "context", "timeline", "platform", "outcome"].map((k, j) => `<div><dt class="lbl">${esc(u.meta[j])}</dt><dd class="t2">${t(c.meta[k])}</dd></div>`).join("")}</dl>
      ${c.stats && c.stats.length ? `<div class="case-stats grid">${c.stats.slice(0, 3).map((x) => `<div><b class="t5">${esc(x.v)}</b><span class="t2">${t(x.l)}</span></div>`).join("")}</div>` : ""}
      ${src(c.cover) ? `<div class="cover case-cover${c.fit === "contain" ? " contain" : ""}" style="--tint:${esc(c.tint)}"><img src="${esc(src(c.cover))}" alt=""></div>` : ""}
      <div class="case-body grid">
        <nav class="toc" aria-label="${esc(u.toc)}">${keys.map((k) => `<a class="tbtn" href="#cs-${k}" data-sec="cs-${k}">${esc(L[k][0])}</a>`).join("")}</nav>
        <div class="flow">${keys.map((k) => `<section class="cs" id="cs-${k}"><h2 class="t4" data-scr>${esc(L[k][1])}</h2>${body[k]}</section>`).join("")}</div>
      </div>
      <button class="next" data-case="${(i + 1) % cs.length}"><span class="lbl muted">${esc(u.next)}</span><span class="t5">${esc(plain(nx.title))}</span></button>
      <footer class="foot grid lbl"><span class="f1">© ${new Date().getFullYear()} ${esc(D().name)}</span><span class="f2"></span><span class="f3"><button class="tbtn" data-back style="margin-right:-8px">${esc(u.back)}</button></span></footer>`;
    watchScr(caseEl);
  }
  let tocIO = null;
  function watchToc() {
    if (tocIO) tocIO.disconnect();
    tocIO = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) $$(".toc a", caseEl).forEach((a) => a.classList.toggle("on", a.dataset.sec === e.target.id)); }), { rootMargin: "-30% 0px -60% 0px" });
    $$(".cs", caseEl).forEach((s) => tocIO.observe(s));
  }

  /* =====================================================================
     ROUTING (plain #case-1 hashes)
     ===================================================================== */
  let view = "home", homeY = 0;
  const viewFromHash = () => { const h = decodeURIComponent(location.hash.slice(1)); const m = /^case-(\d+)$/.exec(h); return m && CASES()[+m[1] - 1] ? h : "home"; };
  function show(v, opts = {}) {
    if (v.startsWith("case-")) {
      if (view === "home") homeY = scrollY;
      view = v; renderCase(+v.slice(5) - 1);
      home.hidden = true; caseEl.hidden = false; scrollTo(0, 0);
      const h1 = $("h1", caseEl); h1 && h1.focus({ preventScroll: true });
      watchToc();
    } else {
      view = "home"; caseEl.hidden = true; home.hidden = false;
      const to = opts.to && document.getElementById(opts.to);
      scrollTo(0, to ? to.getBoundingClientRect().top + scrollY - barH() : homeY);
    }
    syncNav();
  }
  function navigate(v, opts = {}) {
    if (v !== view) { const url = v === "home" ? location.pathname + location.search : "#" + v; try { history.pushState({ v }, "", url); } catch (e) { if (v !== "home") location.hash = v; } }
    glyphSwap(() => show(v, opts), { x: opts.x, y: opts.y, dur: 680, band: 64 });
  }
  addEventListener("popstate", () => { const v = viewFromHash(); if (v !== view) glyphSwap(() => show(v, { to: "work" }), { dur: 680, band: 64 }); });
  addEventListener("hashchange", () => {
    const h = location.hash.slice(1), v = viewFromHash();
    if (v !== view) glyphSwap(() => show(v, { to: document.getElementById(h) ? h : "work" }), { dur: 680, band: 64 });
  });

  const barH = () => $("#bar").offsetHeight + 8;
  let scrollAnim = 0;
  function scrollToEl(el, dur = 900, delay = 0) {
    if (!el) return;
    const y1 = Math.max(0, el.getBoundingClientRect().top + scrollY - barH());
    if (calm) { scrollTo(0, y1); return; }
    const y0 = scrollY, t0 = performance.now() + delay, id = ++scrollAnim;
    const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
    const step = (now) => { if (id !== scrollAnim) return; const k = Math.min(1, Math.max(0, (now - t0) / dur)); scrollTo(0, y0 + (y1 - y0) * ease(k)); if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  }
  ["wheel", "touchstart", "keydown"].forEach((ev) => addEventListener(ev, () => { scrollAnim++; }, { passive: true }));
  const pointOf = (e, el) => { if (e && e.clientX) return { x: e.clientX, y: e.clientY }; const r = el.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; };

  /* ---------- active section in the bar ---------- */
  const NAVIDS = ["top", "work", "projects", "about", "contact"];
  let navRaf = 0;
  function pickNav() { navRaf = 0; if (view !== "home") return; const y = innerHeight * 0.4; let cur = "top"; NAVIDS.forEach((id) => { const el = document.getElementById(id); if (el && el.getBoundingClientRect().top <= y) cur = id; }); $$("[data-nav]").forEach((a) => a.classList.toggle("on", a.dataset.nav === cur)); }
  addEventListener("scroll", () => { if (!navRaf) navRaf = requestAnimationFrame(pickNav); }, { passive: true }); addEventListener("resize", pickNav);
  function syncNav() { if (view !== "home") $$("[data-nav]").forEach((a) => a.classList.toggle("on", a.dataset.nav === "work")); }

  /* =====================================================================
     EVENTS
     ===================================================================== */
  const menu = $("#menu"), burger = $("#burger");
  const setMenu = (open) => { menu.hidden = !open; burger.setAttribute("aria-expanded", String(open)); };
  document.addEventListener("click", (e) => {
    const tgt = e.target;
    if (!tgt.closest("#menu") && !tgt.closest("#burger")) setMenu(false);
    if (tgt.closest("#burger")) { setMenu(menu.hidden); return; }

    const act = tgt.closest("[data-act]");
    if (act) {
      const r = stage.getBoundingClientRect(), pt = pointOf(e, act);
      portrait.burst(pt.x - r.left, pt.y - r.top);
      if (act.dataset.act === "work") { portrait.wipe(pt.x - r.left, pt.y - r.top); scrollToEl($("#work"), 1100, calm ? 0 : 380); }
      else scrollToEl($("#contact"), 1100, 120);
      return;
    }
    const cs = tgt.closest("[data-case]");
    if (cs) { e.preventDefault(); hideTag(); const p = pointOf(e, cs); navigate("case-" + (+cs.dataset.case + 1), { x: p.x, y: p.y }); return; }
    const back = tgt.closest("[data-back]");
    if (back) { const p = pointOf(e, back); navigate("home", { to: "work", x: p.x, y: p.y }); return; }
    const go = tgt.closest("[data-go]");
    if (go) {
      e.preventDefault(); setMenu(false);
      const id = go.dataset.go;
      if (view !== "home") { const p = pointOf(e, go); navigate("home", { to: id, x: p.x, y: p.y }); }
      else scrollToEl(document.getElementById(id));
      return;
    }
    const sec = tgt.closest("[data-sec]");
    if (sec) { e.preventDefault(); const el = document.getElementById(sec.dataset.sec); el && el.scrollIntoView({ behavior: calm ? "auto" : "smooth" }); return; }
    const lb = tgt.closest("[data-lang]");
    if (lb) { if (lb.dataset.lang !== lang) { lang = lb.dataset.lang; store.set("pf2-lang", lang); renderAll(true); } return; }
    if (tgt.closest("#themeBtn")) {
      const next = isDark() ? "light" : "dark", p = pointOf(e, tgt.closest("#themeBtn"));
      glyphSwap(() => { root.dataset.theme = next; store.set("pf2-theme", next); syncThemeBtn(); themeChanged(); }, { x: p.x, y: p.y });
      return;
    }
    const cp = tgt.closest("[data-copy]");
    if (cp) {
      const done = () => toast(U().copied), fail = () => toast(U().copyFail(C.email));
      try { navigator.clipboard.writeText(C.email).then(done, fail); } catch (err) { fail(); }
    }
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") setMenu(false); });

  /* cursor label over the work list */
  const tag = $("#tag");
  function hideTag() { tag.classList.remove("show"); }
  addEventListener("scroll", hideTag, { passive: true });
  document.addEventListener("pointermove", (e) => {
    if (e.pointerType !== "mouse" || !fine.matches) return;
    const over = e.target.closest && e.target.closest(".ccase, .metric, .next");
    if (over) { tag.textContent = U().openCase; tag.style.transform = `translate(${e.clientX + 16}px, ${e.clientY + 14}px)`; tag.classList.add("show"); }
    else hideTag();
  }, { passive: true });

  /* =====================================================================
     START
     ===================================================================== */
  const themeHooks = [];
  function themeChanged() { portrait.setColors(); themeHooks.forEach((f) => f()); }

  let portrait = null;
  function renderAll(keepScroll) {
    const y = scrollY;
    themeHooks.length = 0;
    renderChrome(); renderHero(); renderWork(); renderProjects(); renderAbout(); renderContact(); renderFoot();
    if (view !== "home") { renderCase(+view.slice(5) - 1); watchToc(); }
    if (keepScroll) scrollTo(0, y);
  }
  portrait = makePortrait(stage, src(C.heroPortrait));
  mountField($("#top"));
  renderAll();
  new IntersectionObserver((es) => { if (es[0].intersectionRatio > 0.5 && portrait.wiped) portrait.reassemble(); }, { threshold: [0, 0.5, 1] }).observe(stage);

  const first = viewFromHash();
  if (first !== "home") show(first);
  else if (location.hash.length > 1 && document.getElementById(location.hash.slice(1))) setTimeout(() => scrollTo(0, document.getElementById(location.hash.slice(1)).getBoundingClientRect().top + scrollY - barH()), 60);
});

</script>
